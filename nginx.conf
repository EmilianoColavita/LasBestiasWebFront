server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Archivos con hash de CRA: cache largo
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca cacheado, para que los deploys se vean al instante
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback SPA (React Router / BrowserRouter) — reemplaza al .htaccess
    location / {
        try_files $uri $uri/ /index.html;
    }
}
